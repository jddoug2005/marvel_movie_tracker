<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCU Movies & Shows Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(239, 68, 68, 0.5);
            border-radius: 3px;
        }
        .item-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .item-card:hover {
            transform: translateY(-2px);
        }
        .progress-bar-glow {
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none">

    <!-- Header Section -->

            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex items-center space-x-3">
                    <span class="bg-red-600 text-white font-black px-3 py-1 rounded text-2xl tracking-tighter uppercase shadow-lg border border-red-400/40">MCU</span>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white leading-tight">Universe Tracker</h1>
                        <p class="text-xs text-red-200/80">Interactive Multiverse & Mainline Checklist</p>
                    </div>
                </div>
                
                <!-- Main Dynamic Progress Bar -->
                <div class="flex items-center space-x-4 bg-slate-900/90 p-3 rounded-xl border border-red-500/30 shadow-inner min-w-[300px]">
                    <div class="flex-1">
                        <div class="flex justify-between items-center text-xs font-semibold mb-1.5">
                            <span id="progress-scope-label" class="text-slate-300">Completion</span>
                            <span id="progress-percentage" class="text-red-400 font-mono font-bold text-sm">0%</span>
                        </div>
                        <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden p-0.5 border border-slate-700">
                            <div id="progress-bar-fill" class="bg-gradient-to-r from-red-600 via-amber-500 to-emerald-400 h-2 rounded-full transition-all duration-500 ease-out progress-bar-glow" style="width: 0%"></div>
                        </div>
                    </div>
                    <div class="flex flex-col items-end">
                        <span id="progress-count" class="text-xs font-mono font-bold bg-slate-800 px-2.5 py-1 rounded text-amber-300 border border-slate-700 shadow-sm">0/0</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-6 sm:px-6 lg:px-8 space-y-6">

        <!-- Controls & Filter Dashboard -->

            <!-- Requirement Scope Tabs (Requested feature) -->

                </div>
                
                <div class="grid grid-cols-3 sm:flex gap-1.5 bg-slate-950 p-1 rounded-lg border border-slate-800">
                    <button id="scope-btn-required" onclick="setRequirementFilter('required')" class="px-3.5 py-1.5 rounded-md text-xs font-bold transition-all bg-amber-500/20 text-amber-300 border border-amber-500/40 shadow">
                        <i class="fa-solid fa-star text-amber-400 mr-1.5"></i> Required MCU Only
                    </button>
                    <button id="scope-btn-all" onclick="setRequirementFilter('all')" class="px-3.5 py-1.5 rounded-md text-xs font-medium transition-all text-slate-400 hover:text-white">
                        <i class="fa-solid fa-globe mr-1.5"></i> All Releases
                    </button>
                    <button id="scope-btn-optional" onclick="setRequirementFilter('optional')" class="px-3.5 py-1.5 rounded-md text-xs font-medium transition-all text-slate-400 hover:text-white">
                        <i class="fa-solid fa-puzzle-piece mr-1.5"></i> Side Stories & Shorts
                    </button>
                </div>
            </div>

            <!-- Format & Sorting Toolbar -->
            <div class="flex flex-col md:flex-row gap-3 justify-between items-stretch md:items-center">
                <!-- Sorting Order -->
                <div class="flex bg-slate-950 p-1 rounded-lg border border-slate-800">
                    <button id="btn-release" onclick="setSortMode('release')" class="flex-1 md:flex-initial px-3.5 py-1.5 rounded-md text-xs font-medium transition-colors bg-red-600 text-white shadow">
                        <i class="fa-solid fa-film mr-1.5"></i> Release Order
                    </button>
                    <button id="btn-chrono" onclick="setSortMode('chrono')" class="flex-1 md:flex-initial px-3.5 py-1.5 rounded-md text-xs font-medium transition-colors text-slate-400 hover:text-white">
                        <i class="fa-solid fa-clock-rotate-left mr-1.5"></i> Timeline Order
                    </button>
                </div>

                <!-- Format Filter -->
                <div class="flex bg-slate-950 p-1 rounded-lg border border-slate-800 text-xs font-medium">
                    <button id="filter-type-all" onclick="setTypeFilter('all')" class="flex-1 px-3 py-1.5 rounded-md bg-slate-800 text-white">All Formats</button>
                    <button id="filter-type-movie" onclick="setTypeFilter('movie')" class="flex-1 px-3 py-1.5 rounded-md text-slate-400 hover:text-white">Movies</button>
                    <button id="filter-type-show" onclick="setTypeFilter('show')" class="flex-1 px-3 py-1.5 rounded-md text-slate-400 hover:text-white">Series & Specials</button>
                </div>
            </div>

            <!-- Search, Unwatched & Reset Row -->
            <div class="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-800/80">
                <div class="relative flex-1 min-w-[200px]">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input type="text" id="search-input" oninput="renderApp()" placeholder="Search titles (e.g., Avengers, Loki)..."

                </div>

                    <i class="fa-solid fa-eye-slash mr-1.5 text-slate-400"></i> Hide Watched

        </div>

            <!-- Dynamic Sections Rendered Here -->

        // Application State
        let watchedMovies = new Set();
        let sortMode = 'release';
        let typeFilter = 'all';
        let requirementFilter = 'required'; // Default to "Required MCU Only" as requested!
        let filterUnwatchedOnly = false;

        // Load progress safely from LocalStorage
        function loadProgress() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed)) {
                        watchedMovies = new Set(parsed);
                    }
                }
            } catch (e) {
                console.warn("LocalStorage access unavailable, operating in session mode:", e);
            }
        }

        // Save progress safely
        function saveProgress() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(watchedMovies)));
            } catch (e) {
                console.warn("Unable to write to LocalStorage:", e);
            }
        }

        // Toggle Single Movie Checkbox
        window.toggleMovie = function(id) {
            if (watchedMovies.has(id)) {
                watchedMovies.delete(id);
            } else {
                watchedMovies.add(id);
            }
            saveProgress();
            renderApp();
        };

        // Toggle Phase Completion
        window.togglePhase = function(phaseNum) {
            // Get currently visible/applicable items in this phase according to active requirement filter
            const phaseItems = mcuItems.filter(m => {
                const matchesPhase = m.phase === phaseNum;
                const matchesReq = requirementFilter === 'all' ? true : (requirementFilter === 'required' ? m.essential : !m.essential);
                const matchesType = typeFilter === 'all' ? true : m.type === typeFilter;
                return matchesPhase && matchesReq && matchesType;
            });

            if (phaseItems.length === 0) return;

            const allWatched = phaseItems.every(item => watchedMovies.has(item.id));

            phaseItems.forEach(item => {
                if (allWatched) {
                    watchedMovies.delete(item.id);
                } else {
                    watchedMovies.add(item.id);
                }
            });

            saveProgress();
            renderApp();
        };

        // Reset All Checkmarks
        window.resetProgress = function() {
            if (watchedMovies.size === 0) return;
            if (confirm("Reset all checkmarks?")) {
                watchedMovies.clear();
                saveProgress();
                renderApp();
            }
        };

        // Set Sorting Mode
        window.setSortMode = function(mode) {
            sortMode = mode;
            const btnRelease = document.getElementById('btn-release');
            const btnChrono = document.getElementById('btn-chrono');

            if (mode === 'release') {
                btnRelease.className = "flex-1 md:flex-initial px-3.5 py-1.5 rounded-md text-xs font-medium transition-colors bg-red-600 text-white shadow";
                btnChrono.className = "flex-1 md:flex-initial px-3.5 py-1.5 rounded-md text-xs font-medium transition-colors text-slate-400 hover:text-white";
            } else {
                btnChrono.className = "flex-1 md:flex-initial px-3.5 py-1.5 rounded-md text-xs font-medium transition-colors bg-red-600 text-white shadow";
                btnRelease.className = "flex-1 md:flex-initial px-3.5 py-1.5 rounded-md text-xs font-medium transition-colors text-slate-400 hover:text-white";
            }

            renderApp();
        };

        // Set Format Filter (All, Movies, Series)
        window.setTypeFilter = function(type) {
            typeFilter = type;
            ['all', 'movie', 'show'].forEach(t => {
                const btn = document.getElementById(`filter-type-${t}`);
                if (t === type) {
                    btn.className = "flex-1 px-3 py-1.5 rounded-md bg-slate-800 text-white shadow-sm font-semibold";
                } else {
                    btn.className = "flex-1 px-3 py-1.5 rounded-md text-slate-400 hover:text-white";
                }
            });
            renderApp();
        };

        // Set Requirement Scope Filter (Required, All, Side Stories)
        window.setRequirementFilter = function(req) {
            requirementFilter = req;
            
            const reqBtn = document.getElementById('scope-btn-required');
            const allBtn = document.getElementById('scope-btn-all');
            const optBtn = document.getElementById('scope-btn-optional');

            // Reset styles
            [reqBtn, allBtn, optBtn].forEach(b => {
                b.className = "px-3.5 py-1.5 rounded-md text-xs font-medium transition-all text-slate-400 hover:text-white";
            });

            if (req === 'required') {
                reqBtn.className = "px-3.5 py-1.5 rounded-md text-xs font-bold transition-all bg-amber-500/20 text-amber-300 border border-amber-500/40 shadow";
            } else if (req === 'all') {
                allBtn.className = "px-3.5 py-1.5 rounded-md text-xs font-bold transition-all bg-red-600 text-white shadow";
            } else {
                optBtn.className = "px-3.5 py-1.5 rounded-md text-xs font-bold transition-all bg-blue-500/20 text-blue-300 border border-blue-500/40 shadow";
            }

            renderApp();
        };

        // Toggle Unwatched Filter
        window.toggleFilterUnwatched = function() {
            filterUnwatchedOnly = !filterUnwatchedOnly;
            const btn = document.getElementById('btn-filter-unwatched');
            if (filterUnwatchedOnly) {
                btn.className = "px-3 py-1.5 bg-red-600 text-white rounded-lg text-xs font-medium border border-red-500 transition flex items-center shadow";
            } else {
                btn.className = "px-3 py-1.5 bg-slate-950 hover:bg-slate-800 text-slate-300 rounded-lg text-xs font-medium border border-slate-800 transition flex items-center";
            }
            renderApp();
        };

        // Main App Render Function with Dynamic Progress Bar Update
        window.renderApp = function() {
            const container = document.getElementById('movies-container');
            const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();

            // 1. Calculate Progress dynamically based on the active Requirement & Format scope
            const scopedItems = mcuItems.filter(item => {
                const matchesType = typeFilter === 'all' ? true : item.type === typeFilter;
                const matchesRequirement = requirementFilter === 'all' ? true : (requirementFilter === 'required' ? item.essential : !item.essential);
                return matchesType && matchesRequirement;
            });

            const scopedTotal = scopedItems.length;
            const scopedWatched = scopedItems.filter(item => watchedMovies.has(item.id)).length;
            const percentage = scopedTotal > 0 ? Math.round((scopedWatched / scopedTotal) * 100) : 0;

            // Update Progress UI Elements cleanly
            const labelEl = document.getElementById('progress-scope-label');
            if (requirementFilter === 'required') {
                labelEl.innerText = "Required MCU Progress";
            } else if (requirementFilter === 'optional') {
                labelEl.innerText = "Side Stories Progress";
            } else {
                labelEl.innerText = "Total MCU Progress";
            }

            document.getElementById('progress-percentage').innerText = `${percentage}%`;
            document.getElementById('progress-count').innerText = `${scopedWatched}/${scopedTotal}`;
            
            // Force width update on progress bar
            const barFill = document.getElementById('progress-bar-fill');
            barFill.style.width = `${percentage}%`;

            // 2. Prepare Sorted & Filtered Items for List Display
            let sortedItems = [...mcuItems];
            if (sortMode === 'release') {
                sortedItems.sort((a, b) => a.releaseOrder - b.releaseOrder);
            } else {
                sortedItems.sort((a, b) => a.chronoOrder - b.chronoOrder);
            }

            let filteredItems = sortedItems.filter(item => {
                const matchesSearch = item.title.toLowerCase().includes(searchQuery);
                const matchesUnwatched = filterUnwatchedOnly ? !watchedMovies.has(item.id) : true;
                const matchesType = typeFilter === 'all' ? true : item.type === typeFilter;
                const matchesRequirement = requirementFilter === 'all' ? true : (requirementFilter === 'required' ? item.essential : !item.essential);
                return matchesSearch && matchesUnwatched && matchesType && matchesRequirement;
            });

            if (filteredItems.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-slate-900/90 rounded-xl border border-slate-800">
                        <i class="fa-solid fa-film text-4xl text-slate-700 mb-3"></i>
                        <p class="text-slate-400 font-medium">No movies or shows match your current filters.</p>
                        <p class="text-slate-600 text-xs mt-1">Try switching content scope to 'All Releases' or clearing your search.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';

            if (sortMode === 'release') {
                const phases = [1, 2, 3, 4, 5, 6];

                phases.forEach(phaseNum => {
                    const phaseItems = filteredItems.filter(m => m.phase === phaseNum);
                    if (phaseItems.length === 0) return;

                    // Calculate phase completion status based on visible items
                    const allPhaseScopeItems = scopedItems.filter(m => m.phase === phaseNum);
                    const phaseWatchedCount = allPhaseScopeItems.filter(m => watchedMovies.has(m.id)).length;
                    const phaseTotal = allPhaseScopeItems.length;
                    const isPhaseComplete = phaseWatchedCount === phaseTotal && phaseTotal > 0;
                    const sagaName = phaseItems[0]?.saga || "";

                    const section = document.createElement('section');
                    section.className = "bg-slate-900/80 rounded-xl border border-slate-800 overflow-hidden shadow-sm";

                    section.innerHTML = `
                        <div class="bg-slate-800/80 px-4 py-3 sm:px-6 flex flex-wrap justify-between items-center border-b border-slate-700/60 gap-2">
                            <div class="flex items-center space-x-3">
                                <span class="text-[10px] font-bold uppercase tracking-wider text-red-400 bg-red-950/80 border border-red-800/40 px-2 py-0.5 rounded">
                                    ${sagaName}
                                </span>
                                <h2 class="text-lg font-bold text-white">Phase ${phaseNum}</h2>
                            </div>
                            
                            <div class="flex items-center space-x-3">
                                <span class="text-xs font-mono text-slate-400">${phaseWatchedCount}/${phaseTotal} Done</span>
                                <button onclick="togglePhase(${phaseNum})" class="text-xs font-semibold px-2.5 py-1 rounded border transition ${
                                    isPhaseComplete 
                                    ? 'bg-emerald-950/60 text-emerald-400 border-emerald-800/50 hover:bg-emerald-900/60' 
                                    : 'bg-slate-800 hover:bg-slate-700 text-slate-200 border-slate-700'
                                }">
                                    ${isPhaseComplete ? '<i class="fa-solid fa-check mr-1"></i> Phase Completed' : 'Mark Phase'}
                                </button>
                            </div>
                        </div>

                        <div class="p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                            ${phaseItems.map(item => createCardHTML(item)).join('')}
                        </div>
                    `;

                    container.appendChild(section);
                });

            } else {
                // In-Universe Timeline View
                const section = document.createElement('section');
                section.className = "bg-slate-900/80 rounded-xl border border-slate-800 overflow-hidden p-4 shadow-sm";

                section.innerHTML = `
                    <div class="mb-4 pb-2 border-b border-slate-800 flex justify-between items-center">
                        <h2 class="text-lg font-bold text-white flex items-center">
                            <i class="fa-solid fa-timeline text-red-500 mr-2"></i> MCU Chronological Timeline
                        </h2>
                        <span class="text-xs text-slate-400 font-mono">In-Universe Order</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                        ${filteredItems.map(item => createCardHTML(item, true)).join('')}
                    </div>
                `;

                container.appendChild(section);
            }
        };

        // Helper: Generate Card HTML
        function createCardHTML(item, showChronoBadge = false) {
            const isWatched = watchedMovies.has(item.id);

            return `
                <div onclick="toggleMovie('${item.id}')" 
                     class="item-card cursor-pointer p-3.5 rounded-xl border flex items-center justify-between transition-all select-none ${
                        isWatched 
                        ? 'bg-slate-900/40 border-emerald-600/30 text-slate-400' 
                        : 'bg-slate-900 border-slate-800 hover:border-red-500/60 text-slate-100 shadow-md'
                     }">
                    
                    <div class="flex items-center space-x-3 min-w-0 pr-2">
                        <!-- Custom Checkbox -->
                        <div class="w-5 h-5 rounded-md flex items-center justify-center transition-colors flex-shrink-0 ${
                            isWatched 
                            ? 'bg-emerald-500 text-slate-950 font-bold' 
                            : 'border-2 border-slate-600 bg-slate-950 hover:border-red-500'
                        }">
                            ${isWatched ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                        </div>

                        <div class="truncate">
                            <div class="flex items-center space-x-2">
                                <h3 class="font-semibold text-sm truncate ${isWatched ? 'line-through text-slate-500' : 'text-slate-100'}">
                                    ${item.title}
                                </h3>
                            </div>
                            
                            <div class="flex items-center space-x-1.5 text-xs text-slate-400 mt-1 flex-wrap gap-y-1">
                                <span class="px-1.5 py-0.2 rounded ${item.essential ? 'bg-amber-950/80 text-amber-300 border border-amber-800/40 font-medium' : 'bg-slate-800 text-slate-400'}">
                                    ${item.essential ? 'Required' : 'Side Story'}
                                </span>
                                <span>&bull;</span>
                                <span class="${item.type === 'show' ? 'text-blue-400 font-medium' : 'text-slate-400'}">${item.type === 'show' ? 'Series' : 'Movie'}</span>
                                <span>&bull;</span>
                                <span>${item.year}</span>
                                ${showChronoBadge ? `<span>&bull;</span> <span class="text-amber-400/90 font-mono">#${item.chronoOrder}</span>` : ''}
                            </div>
                        </div>
                    </div>

                    <div class="text-slate-500 text-xs flex-shrink-0 ml-2">
                        <i class="fa-solid ${item.icon}"></i>
                    </div>
                </div>
            `;
        }

        // Initialize App on DOM Ready
        document.addEventListener('DOMContentLoaded', () => {
            loadProgress();
            renderApp();
        });
    </script>
</body>
</html>
